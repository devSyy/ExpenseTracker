name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: |
          docker build -t expense-tracker:latest .

      - name: 서비스 재시작
        run: |
          docker compose -f /srv/expenseTracker/docker-compose.yml up -d --force-recreate