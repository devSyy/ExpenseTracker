<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>가계부 대시보드 · 2025-04-27 ~ 2026-04-27</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root { color-scheme: light; --bg:#f7f8fa; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#2563eb; --pos:#16a34a; --neg:#dc2626; --warn:#d97706; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; margin:0; background:var(--bg); color:var(--text); font-size:14px; line-height:1.5; }
.container { max-width:1280px; margin:0 auto; padding:24px; }
h1 { font-size:22px; margin:0 0 4px; font-weight:700; }
.sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
.grid { display:grid; gap:16px; }
.kpi-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom:20px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
.kpi .label { font-size:12px; color:var(--muted); margin-bottom:6px; }
.kpi .val { font-size:20px; font-weight:700; }
.kpi .sub2 { font-size:11px; color:var(--muted); margin-top:4px; }
.row { display:grid; grid-template-columns: 2fr 1fr; gap:16px; margin-bottom:16px; }
.row-eq { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-bottom:16px; }
.row-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
@media(max-width:900px){ .row,.row-eq,.row-3{ grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
.card h3 { margin:0 0 12px; font-size:14px; font-weight:600; }
.chart-wrap { position:relative; height:260px; }
.chart-wrap-sm { position:relative; height:220px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; padding:8px 10px; background:#f9fafb; border-bottom:1px solid var(--line); font-weight:600; color:var(--muted); position:sticky; top:0; }
td { padding:7px 10px; border-bottom:1px solid #f1f3f5; }
tr:hover td { background:#fafbfd; }
.amt-neg { color:var(--neg); font-variant-numeric:tabular-nums; text-align:right; }
.amt-pos { color:var(--pos); font-variant-numeric:tabular-nums; text-align:right; }
.amt-trf { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
.tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:10px; background:#eef2ff; color:#3730a3; }
.tag-exp { background:#fef2f2; color:#b91c1c; }
.tag-inc { background:#ecfdf5; color:#166534; }
.tag-trf { background:#f3f4f6; color:#4b5563; }
.controls { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
input[type=text], select { padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:#fff; }
input[type=text] { flex:1; min-width:180px; }
.scroll { max-height:480px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.bar-row { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.5px; }
.bar-row .nm { width:130px; flex-shrink:0; color:var(--text); }
.bar-row .bar-bg { flex:1; height:18px; background:#f1f3f5; border-radius:4px; overflow:hidden; }
.bar-row .bar-fg { height:100%; background:var(--accent); border-radius:4px; }
.bar-row .vl { width:110px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
.legend { font-size:11px; color:var(--muted); margin-top:8px; }
.note { font-size:11.5px; color:var(--muted); margin-top:6px; }
</style>
</head>

<div class="container">
  <h1>가계부 대시보드</h1>
  <div class="sub" id="periodLabel">기간 로드 중…</div>

  <div class="grid kpi-grid" id="kpiGrid"></div>

      <div class="chart-wrap"><canvas id="chartMonthly"></canvas></div>
      <div class="note">막대: 지출 합계 · 선: 거래 건수</div>
    </div>
    <div class="card">
      <h3>대분류 지출 비중</h3>
      <div class="chart-wrap"><canvas id="chartCategoryPie"></canvas></div>
    </div>
  </div>

  <div class="row-eq">
    <div class="card">
      <h3>대분류별 지출 (TOP 10)</h3>
      <div id="catBars"></div>
    </div>
    <div class="card">
      <h3>결제수단별 지출</h3>
      <div id="payBars"></div>
    </div>
  </div>

  <div class="row-3">
    <div class="card">
      <h3>요일별 지출 패턴</h3>
      <div class="chart-wrap-sm"><canvas id="chartDow"></canvas></div>
    </div>
    <div class="card">
      <h3>소분류 TOP 10</h3>
      <div id="subBars"></div>
    </div>
    <div class="card">
      <h3>가맹점/내용 TOP 10</h3>
      <div id="merchBars"></div>
    </div>
  </div>

  <div class="card">
    <h3>거래 내역 (필터·검색)</h3>
    <div class="controls">
      <input type="text" id="q" placeholder="가맹점/내용/카테고리 검색…">
      <select id="fType">
        <option value="">타입 전체</option>
        <option value="지출">지출</option>
        <option value="수입">수입</option>
        <option value="이체">이체</option>
      </select>
      <select id="fCat"><option value="">대분류 전체</option></select>
      <select id="fPay"><option value="">결제수단 전체</option></select>
      <select id="fMonth"><option value="">월 전체</option></select>
      <span id="rowCount" style="align-self:center; color:var(--muted); font-size:12px;"></span>
    </div>
    <div class="scroll">
      <table id="txnTable">
        <thead>
          <tr><th>날짜</th><th>시간</th><th>타입</th><th>대분류</th><th>소분류</th><th>내용</th><th style="text-align:right;">금액</th><th>결제수단</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="legend">데이터: 업로드된 가계부 내역 · 통화: KRW · 이체는 KPI 합산에서 분리</div>
</div>

// KPI
const kpiSpec = [

kpiSpec.forEach(k => {

});

    datasets: [
      { type:'bar', label:'지출', data: DATA.monthly.map(m=>m.exp), backgroundColor:'#2563eb', yAxisID:'y' },
      { type:'line', label:'건수', data: DATA.monthly.map(m=>m.count), borderColor:'#dc2626', backgroundColor:'#dc2626', yAxisID:'y1', tension:0.3, pointRadius:3 }
    ]
  },
  options: {
    maintainAspectRatio:false, responsive:true,
    plugins:{ legend:{ position:'bottom', labels:{ font:{ size:11 } } },
      tooltip:{ callbacks:{ label:(c)=> c.dataset.yAxisID==='y' ? `지출 ${fmtKRW(c.parsed.y)}` : `건수 ${c.parsed.y}` } } },
    scales:{
      y:{ position:'left', ticks:{ callback:v=>(v/10000)+'만'}, grid:{ color:'#f1f3f5' } },
      y1:{ position:'right', grid:{ display:false }, ticks:{ precision:0 } },
      x:{ grid:{ display:false } }
    }
  }
});

// Category Pie
const cats = DATA.categories;
new Chart(document.getElementById('chartCategoryPie'), {
  type:'doughnut',
  data:{ labels: cats.map(c=>c.name), datasets:[{ data: cats.map(c=>c.sum), backgroundColor: palette.slice(0,cats.length) }] },
  options:{ maintainAspectRatio:false, responsive:true, plugins:{ legend:{ position:'right', labels:{ font:{ size:11 }, boxWidth:10 } },
    tooltip:{ callbacks:{ label:(c)=> `${c.label}: ${fmtKRW(c.parsed)}` } } } }
});

// Bar list helper
function renderBars(elId, items, max) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  items.forEach(it => {
    const pct = max > 0 ? (it.sum / max * 100) : 0;
    const row = document.createElement('div'); row.className='bar-row';
    row.innerHTML = `<div class="nm" title="${it.name}">${it.name}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct.toFixed(1)}%"></div></div>
      <div class="vl">${fmtKRW(it.sum)} <span style="opacity:.6">·${it.count}</span></div>`;
    el.appendChild(row);
  });
}

const top10cats = cats.slice(0,10);
renderBars('catBars', top10cats, top10cats[0]?.sum||1);

const top10pay = DATA.payments.slice(0,10);
renderBars('payBars', top10pay, top10pay[0]?.sum||1);

const top10sub = DATA.subs.slice(0,10).map(s=>({name:`${s.cat} · ${s.name}`, sum:s.sum, count:s.count}));
renderBars('subBars', top10sub, top10sub[0]?.sum||1);

const top10m = DATA.merchants.slice(0,10);
renderBars('merchBars', top10m, top10m[0]?.sum||1);

// DoW chart
new Chart(document.getElementById('chartDow'), {
  type:'bar',
  data:{ labels: DATA.dow.map(d=>d.day), datasets:[{ label:'지출', data: DATA.dow.map(d=>d.sum), backgroundColor:'#7c3aed' }] },
  options:{ maintainAspectRatio:false, responsive:true, plugins:{ legend:{ display:false },
    tooltip:{ callbacks:{ label:(c)=> `${fmtKRW(c.parsed.y)} · ${DATA.dow[c.dataIndex].count}건` } } },
    scales:{ y:{ ticks:{ callback:v=>(v/10000)+'만'}, grid:{ color:'#f1f3f5' } }, x:{ grid:{ display:false } } } }
});

// Filters: populate
const fCat = document.getElementById('fCat');
const fPay = document.getElementById('fPay');
const fMonth = document.getElementById('fMonth');
[...new Set(DATA.txns.map(t=>t.c1))].sort().forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; fCat.appendChild(o); });
[...new Set(DATA.txns.map(t=>t.p))].sort().forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; fPay.appendChild(o); });
[...new Set(DATA.txns.map(t=>t.d.slice(0,7)))].sort().reverse().forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; fMonth.appendChild(o); });

const tbody = document.querySelector('#txnTable tbody');
const rowCount = document.getElementById('rowCount');
const q = document.getElementById('q');
const fType = document.getElementById('fType');

function tagClass(tp){ return tp==='지출' ? 'tag-exp' : tp==='수입' ? 'tag-inc' : 'tag-trf'; }
function amtClass(tp){ return tp==='지출' ? 'amt-neg' : tp==='수입' ? 'amt-pos' : 'amt-trf'; }

function render() {
  const term = q.value.trim().toLowerCase();
  const tp = fType.value, c = fCat.value, p = fPay.value, m = fMonth.value;
  const rows = DATA.txns.filter(t =>
    (!term || (t.n+' '+t.c1+' '+t.c2+' '+t.p).toLowerCase().includes(term)) &&
    (!tp || t.tp===tp) && (!c || t.c1===c) && (!p || t.p===p) && (!m || t.d.startsWith(m))
  );
  const limit = 500;
  const shown = rows.slice(0, limit);
  tbody.innerHTML = shown.map(t => `
    <tr>
      <td>${t.d}</td><td>${t.t}</td>
      <td><span class="tag ${tagClass(t.tp)}">${t.tp}</span></td>
      <td>${t.c1}</td><td>${t.c2}</td>
      <td>${t.n}</td>
      <td class="${amtClass(t.tp)}">${fmt(t.a)}</td>
      <td>${t.p}</td>
    </tr>`).join('');
  let sum = 0; rows.forEach(r => { if (r.tp==='지출') sum += Math.abs(r.a); });
  rowCount.textContent = `${fmt(rows.length)}건${rows.length>limit?` (상위 ${limit}건 표시)`:''} · 지출합계 ${fmtKRW(sum)}`;
}
[q,fType,fCat,fPay,fMonth].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
